<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
    margin:0;
    padding:8px;
    font-family:Arial;
    text-align:center;
    background:#111;
    color:#fff;
}
textarea{
    width:98%;
    height:60px;
    font-size:14px;
}
#led{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#555;
    margin:10px auto;
}
#bar{
    width:100%;
    height:12px;
    background:#333;
}
#fill{
    width:0%;
    height:100%;
    background:#0f0;
}
button{
    width:46%;
    height:40px;
    margin:5px 1%;
    font-size:16px;
}
#time{
    font-size:22px;
    margin:8px;
}
</style>
</head>
<body>

<textarea id="txt">Hello! This is a speech synthesis test.</textarea>

<div id="led"></div>

<div id="bar">
<div id="fill"></div>
</div>

<div id="time">0.0 s</div>

<button onclick="go()">▶ Speak</button>
<button onclick="stop()">■ Stop</button>

<script>

const synth=speechSynthesis;
let timer,start;

function go(){

    synth.cancel();

    const u=new SpeechSynthesisUtterance(txt.value);

    fill.style.width="0%";
    led.style.background="orange";

    start=Date.now();

    timer=setInterval(()=>{
        time.textContent=((Date.now()-start)/1000).toFixed(1)+" s";

        if(synth.speaking)
            led.style.background="lime";
    },100);

    u.onboundary=e=>{
        fill.style.width=
        (100*e.charIndex/txt.value.length)+"%";
    };

    u.onstart=()=>{
        led.style.background="lime";
    };

    u.onend=finish;
    u.onerror=finish;

    synth.speak(u);
}

function finish(){

    clearInterval(timer);

    led.style.background="red";

    fill.style.width="100%";
}

function stop(){

    synth.cancel();

    finish();

}

</script>

</body>
</html>
